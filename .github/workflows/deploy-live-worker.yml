name: Desplegar marcador LIVE (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LIVE_WORKER/**'
      - '.github/workflows/deploy-live-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar LIVE y configurar Durable Object y Service Binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: LIVE_WORKER
          command: deploy
