name: Desplegar API CT Campeador

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ct-campeador-api
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Wrangler
        working-directory: API_WORKER
        run: npm install

      - name: Desplegar API en Cloudflare
        working-directory: API_WORKER
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ./wrangler.toml
